services:
  asd_worker:
    build: .
    container_name: asd-worker
    environment:
      # Evita el choque MKL/OpenMP (MKL_THREADING_LAYER=INTEL vs libgomp) al lanzar
      # demoTalkNet como subproceso junto a ffmpeg/opencv.
      - MKL_THREADING_LAYER=GNU
    ports:
      - "8900:8900"
    volumes:
      - asd_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]      # 0 = RTX 4060 Ti (la de 16GB). nvidia-smi -L para verificar.
              capabilities: [gpu]
    restart: unless-stopped

  person_worker:
    build: ./person
    container_name: person-worker
    command: uvicorn app:app --host 0.0.0.0 --port 8901 --reload
    ports:
      - "8901:8901"
    volumes:
      - person_data:/data
      - ./person:/app          # código montado: cambios sin rebuild (uvicorn --reload)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]      # misma 4060 Ti; YOLO es ligero, convive con TalkNet
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  asd_data:
  person_data:
