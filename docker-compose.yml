services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intro_python_backend
    env_file:
      - .env
    ports:
      - "8800:8000"
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    # Actualiza yt-dlp a la ultima version en cada arranque (sus extractores se
    # rompen cada pocas semanas) antes de levantar la API.
    command: sh -c "pip install --no-cache-dir --upgrade yt-dlp && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: intro_python_frontend
    depends_on:
      - backend
    working_dir: /app
    ports:
      - "5074:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
