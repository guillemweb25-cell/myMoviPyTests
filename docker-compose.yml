services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intro_python_backend
    env_file:
      - .env
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT} --reload"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: intro_python_frontend
    depends_on:
      - backend
    env_file:
      - .env
    working_dir: /app
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT}
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT}"

volumes:
  frontend_node_modules:
