services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intro_python_backend
    env_file:
      - .env
    ports:
      - "8800:8000"
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    restart: unless-stopped         # sin esto no vuelve tras un reboot y el
                                    # frontend (nginx) entra en bucle: no
                                    # resuelve el upstream "backend".
    # Actualiza yt-dlp en cada arranque (sus extractores se rompen cada pocas
    # semanas) y garantiza curl_cffi para la impersonation de navegador que
    # exigen algunos sitios (Cloudflare / 403), antes de levantar la API.
    command: sh -c "(command -v deno >/dev/null || (apt-get update && apt-get install -y --no-install-recommends curl unzip && curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip && unzip -o /tmp/deno.zip -d /usr/local/bin && chmod +x /usr/local/bin/deno)) && pip install --no-cache-dir --upgrade yt-dlp curl_cffi && pip install --no-cache-dir openai google-auth-oauthlib google-api-python-client gdown pydub && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production            # nginx sirviendo la build (dist/). Sin HMR:
                                    # no recarga al volver a la pestaña. Para
                                    # aplicar cambios de front: recompilar la
                                    # imagen (docker compose build frontend && up -d).
    container_name: intro_python_frontend
    depends_on:
      - backend
    ports:
      - "5074:80"
    restart: unless-stopped

  # Motion graphics (Remotion). Opcional: si no está levantado, el backend usa el
  # camino de siempre (ffmpeg + subtítulos ASS). Ver doc/08-fx-worker-motion-graphics.md.
  fx_worker:
    build: ./fx_worker
    container_name: intro_python_fx
    ports:
      - "8910:3000"
    volumes:
      - ./fx_worker/assets:/app/assets:ro
      - ./backend/assets/fonts:/app/fonts:ro
      - ./backend/assets/music:/app/music:ro
    shm_size: "1gb"                 # Chromium headless lo necesita: con los 64 MB
                                    # por defecto se cae a mitad del render.
    environment:
      # Pestañas de Chromium por render. Con una por núcleo (el defecto de
      # Remotion) el navegador se cae por RAM en esta VM. Subir solo si sobra.
      FX_CONCURRENCY: "1"
      # Escala del render: 1 = 1080x1920. Bajar a 0.67 (720x1280) si la máquina
      # no da para el render a resolución completa.
      FX_SCALE: "1"
    restart: unless-stopped
