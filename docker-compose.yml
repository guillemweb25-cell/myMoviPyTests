services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: intro_python_backend
    env_file:
      - .env
    ports:
      - "8800:8000"
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    # Actualiza yt-dlp en cada arranque (sus extractores se rompen cada pocas
    # semanas) y garantiza curl_cffi para la impersonation de navegador que
    # exigen algunos sitios (Cloudflare / 403), antes de levantar la API.
    command: sh -c "pip install --no-cache-dir --upgrade yt-dlp curl_cffi && pip install --no-cache-dir openai google-auth-oauthlib google-api-python-client && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: intro_python_frontend
    depends_on:
      - backend
    working_dir: /app
    ports:
      - "5074:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  frontend_node_modules:
