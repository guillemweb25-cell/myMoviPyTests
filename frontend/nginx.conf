server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subidas grandes (vídeos para transcribir, cookies, client_secret).
    client_max_body_size 8g;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (log en vivo de jobs vía EventSource): sin buffering para que las
        # líneas lleguen en tiempo real, y timeouts largos para jobs lentos
        # (detección/render) y streams que quedan abiertos.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets con hash en el nombre (index-XXXX.js/css): caché larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html SIEMPRE revalida: así el móvil no se queda con una versión vieja
    # que apunta a un bundle JS antiguo (por eso no se veían botones nuevos).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}
